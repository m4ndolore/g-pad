<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1150">
  <!-- Ball droid. Tones: outline #1a1a1a, dark #464646, mid #8e8e8e, light #d4d4d4, body #f4f4f4 -->
  <g stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">

    <!-- ==== ball body ==== -->
    <circle cx="500" cy="720" r="390" fill="#f4f4f4"/>

    <!-- big ring panel, front -->
    <circle cx="500" cy="720" r="205" fill="#f4f4f4"/>
    <circle cx="500" cy="720" r="150" fill="#8e8e8e"/>
    <circle cx="500" cy="720" r="95" fill="#f4f4f4"/>
    <rect x="455" y="675" width="90" height="90" rx="16" fill="#d4d4d4"/>

    <!-- partial ring panels at the ball's edge: full circles clipped by the
         ball, so they wrap around the sphere the way the film droid's do -->
    <clipPath id="ball"><circle cx="500" cy="720" r="386"/></clipPath>
    <g clip-path="url(#ball)">
      <circle cx="105" cy="560" r="180" fill="none" stroke="#8e8e8e" stroke-width="52"/>
      <circle cx="105" cy="560" r="206" fill="none" stroke-width="8"/>
      <circle cx="105" cy="560" r="154" fill="none" stroke-width="8"/>
      <circle cx="905" cy="620" r="170" fill="none" stroke="#8e8e8e" stroke-width="52"/>
      <circle cx="905" cy="620" r="196" fill="none" stroke-width="8"/>
      <circle cx="905" cy="620" r="144" fill="none" stroke-width="8"/>
      <circle cx="470" cy="1160" r="185" fill="none" stroke="#8e8e8e" stroke-width="52"/>
      <circle cx="470" cy="1160" r="211" fill="none" stroke-width="8"/>
      <circle cx="470" cy="1160" r="159" fill="none" stroke-width="8"/>
    </g>

    <!-- small tech dots on the ball -->
    <circle cx="390" cy="480" r="26" fill="#464646"/>
    <circle cx="680" cy="920" r="26" fill="#464646"/>

    <!-- ==== dome head, tilted on top ==== -->
    <g transform="rotate(-12 500 340)">
      <path d="M330 345 Q 330 175 500 175 Q 670 175 670 345 Z" fill="#f4f4f4"/>
      <!-- head band -->
      <path d="M330 345 L670 345 L670 310 L330 310 Z" fill="#8e8e8e" stroke="none"/>
      <path d="M330 345 L670 345" stroke-width="9" fill="none"/>
      <path d="M330 310 L670 310" stroke-width="7" fill="none"/>
      <!-- band across mid-head -->
      <path d="M338 260 Q 500 215 662 262" fill="none" stroke="#d4d4d4" stroke-width="34"/>
      <path d="M338 260 Q 500 215 662 262" fill="none" stroke-width="0"/>
      <!-- main eye -->
      <circle cx="470" cy="255" r="58" fill="#1a1a1a"/>
      <circle cx="470" cy="255" r="42" fill="#464646"/>
      <circle cx="453" cy="238" r="13" fill="#f4f4f4" stroke="none"/>
      <!-- small lens -->
      <circle cx="585" cy="290" r="22" fill="#8e8e8e"/>
      <circle cx="585" cy="290" r="10" fill="#1a1a1a" stroke="none"/>
      <!-- antennas -->
      <line x1="480" y1="175" x2="480" y2="95" stroke-width="10"/>
      <line x1="540" y1="175" x2="545" y2="60" stroke-width="10"/>
      <rect x="537" y="60" width="16" height="30" rx="6" fill="#464646" stroke="none"/>
    </g>
  </g>
</svg>
