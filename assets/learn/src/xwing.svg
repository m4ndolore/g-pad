<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1000">
  <!-- Starfighter from above, S-foils open. Tones: outline #1a1a1a,
       hull #f0f0f0, panel #d4d4d4, stripe #8e8e8e, engine #464646 -->
  <g stroke="#1a1a1a" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">

    <!-- ==== wings (behind fuselage) ==== -->
    <!-- upper-left / upper-right wings sweep forward-out; lower pair behind -->
    <g>
      <!-- left wings -->
      <path d="M480 470 L 90 330 L 55 355 L 460 560 Z" fill="#d4d4d4"/>
      <path d="M480 560 L 60 660 L 95 700 L 470 630 Z" fill="#f0f0f0"/>
      <!-- right wings -->
      <path d="M620 470 L 1010 330 L 1045 355 L 640 560 Z" fill="#d4d4d4"/>
      <path d="M620 560 L 1040 660 L 1005 700 L 630 630 Z" fill="#f0f0f0"/>
      <!-- wing stripes -->
      <path d="M300 405 L 255 385 L 240 400 L 290 425 Z" fill="#8e8e8e" stroke-width="6"/>
      <path d="M800 405 L 845 385 L 860 400 L 810 425 Z" fill="#8e8e8e" stroke-width="6"/>
      <!-- wingtip cannons: all four run forward, parallel to the nose -->
      <line x1="75" y1="345" x2="75" y2="140" stroke-width="13"/>
      <rect x="63" y="110" width="24" height="34" rx="8" fill="#464646" stroke-width="6"/>
      <line x1="1025" y1="345" x2="1025" y2="140" stroke-width="13"/>
      <rect x="1013" y="110" width="24" height="34" rx="8" fill="#464646" stroke-width="6"/>
      <line x1="45" y1="680" x2="45" y2="500" stroke-width="13"/>
      <rect x="33" y="470" width="24" height="34" rx="8" fill="#464646" stroke-width="6"/>
      <line x1="1055" y1="680" x2="1055" y2="500" stroke-width="13"/>
      <rect x="1043" y="470" width="24" height="34" rx="8" fill="#464646" stroke-width="6"/>
      <!-- engines at wing roots -->
      <rect x="395" y="480" width="95" height="60" rx="26" fill="#464646"/>
      <rect x="610" y="480" width="95" height="60" rx="26" fill="#464646"/>
      <rect x="405" y="560" width="85" height="56" rx="24" fill="#8e8e8e"/>
      <rect x="610" y="560" width="85" height="56" rx="24" fill="#8e8e8e"/>
    </g>

    <!-- ==== fuselage ==== -->
    <path d="M508 60 Q 550 30 592 60 L 600 380 L 620 470 Q 630 620 600 780 Q 550 830 500 780 Q 470 620 480 470 L 500 380 Z" fill="#f0f0f0"/>
    <!-- nose stripes -->
    <path d="M503 200 L 597 200 L 598 240 L 502 240 Z" fill="#8e8e8e" stroke-width="6"/>
    <path d="M502 270 L 598 270 L 599 300 L 501 300 Z" fill="#d4d4d4" stroke-width="6"/>
    <!-- cockpit -->
    <path d="M510 400 Q 550 380 590 400 L 585 540 Q 550 565 515 540 Z" fill="#464646"/>
    <path d="M518 415 Q 550 400 582 415" fill="none" stroke="#8e8e8e" stroke-width="7"/>
    <line x1="550" y1="392" x2="550" y2="552" stroke="#8e8e8e" stroke-width="7"/>
    <!-- astromech dome behind cockpit -->
    <circle cx="550" cy="620" r="34" fill="#d4d4d4"/>
    <circle cx="550" cy="620" r="14" fill="#8e8e8e"/>
    <!-- tail block -->
    <rect x="520" y="700" width="60" height="60" rx="12" fill="#d4d4d4"/>
  </g>
</svg>
