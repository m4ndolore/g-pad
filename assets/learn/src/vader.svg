<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1100">
  <!-- The dark helmet, kept friendly: bold shapes, a sheen on the dome so the
       page is not one black mass. Tones: outline #1a1a1a, helmet #3a3a3a,
       sheen #6a6a6a, mask #565656, grille #1a1a1a, lens #202020 -->
  <g stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">

    <!-- ==== shoulders / cape ==== -->
    <path d="M120 1080 Q 150 830 340 760 L 660 760 Q 850 830 880 1080 Z" fill="#3a3a3a"/>
    <path d="M330 765 L 285 1080 M 670 765 L 715 1080" fill="none" stroke-width="7" stroke="#6a6a6a"/>
    <!-- chest box -->
    <rect x="400" y="900" width="200" height="140" rx="14" fill="#565656"/>
    <rect x="425" y="925" width="44" height="30" rx="6" fill="#a8a8a8" stroke-width="6"/>
    <rect x="478" y="925" width="44" height="30" rx="6" fill="#6a6a6a" stroke-width="6"/>
    <rect x="531" y="925" width="44" height="30" rx="6" fill="#a8a8a8" stroke-width="6"/>
    <rect x="425" y="975" width="150" height="16" rx="8" fill="#6a6a6a" stroke-width="6"/>
    <rect x="425" y="1005" width="150" height="16" rx="8" fill="#6a6a6a" stroke-width="6"/>

    <!-- ==== helmet dome ==== -->
    <path d="M235 620 Q 200 480 240 370 Q 300 190 500 190 Q 700 190 760 370 Q 800 480 765 620 Q 700 700 500 705 Q 300 700 235 620 Z" fill="#3a3a3a"/>
    <!-- dome sheen -->
    <path d="M320 300 Q 400 230 500 228 Q 430 260 380 330 Q 340 390 330 460 Q 300 400 320 300 Z" fill="#6a6a6a" stroke="none"/>
    <!-- dome ridge -->
    <path d="M500 195 L 500 430" fill="none" stroke-width="8" stroke="#565656"/>

    <!-- ==== face mask ==== -->
    <!-- brow line -->
    <path d="M285 500 Q 500 430 715 500 Q 720 530 700 545 Q 500 480 300 545 Q 280 530 285 500 Z" fill="#565656"/>
    <!-- eyes: big triangular lenses -->
    <path d="M330 560 Q 420 520 480 570 Q 470 650 400 655 Q 340 650 330 560 Z" fill="#202020"/>
    <path d="M670 560 Q 580 520 520 570 Q 530 650 600 655 Q 660 650 670 560 Z" fill="#202020"/>
    <circle cx="390" cy="575" r="14" fill="#8e8e8e" stroke="none"/>
    <circle cx="610" cy="575" r="14" fill="#8e8e8e" stroke="none"/>
    <!-- cheek ridges down to the grille -->
    <path d="M370 665 Q 400 700 445 715 L 445 790 Q 390 780 350 730 Q 355 690 370 665 Z" fill="#565656"/>
    <path d="M630 665 Q 600 700 555 715 L 555 790 Q 610 780 650 730 Q 645 690 630 665 Z" fill="#565656"/>
    <!-- nose bridge -->
    <path d="M460 640 Q 500 620 540 640 Q 540 690 500 700 Q 460 690 460 640 Z" fill="#3a3a3a"/>
    <!-- mouth grille -->
    <path d="M445 700 L 555 700 Q 585 760 555 830 L 445 830 Q 415 760 445 700 Z" fill="#565656"/>
    <line x1="500" y1="705" x2="500" y2="828" stroke-width="8"/>
    <line x1="466" y1="708" x2="462" y2="822" stroke-width="8"/>
    <line x1="534" y1="708" x2="538" y2="822" stroke-width="8"/>
  </g>
</svg>
