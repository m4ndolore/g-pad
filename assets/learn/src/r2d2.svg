<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1200">
  <!-- Astromech droid, flat-tone grayscale for GC16 e-ink.
       Tones: outline #1a1a1a, dark #464646, mid #8e8e8e, light #d4d4d4, body #f2f2f2 -->
  <g stroke="#1a1a1a" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">

    <!-- ==== center foot ==== -->
    <path d="M455 1080 L545 1080 L560 1130 L440 1130 Z" fill="#8e8e8e"/>

    <!-- ==== legs ==== -->
    <!-- left leg -->
    <g>
      <path d="M150 430 L230 430 L235 760 L215 990 L165 990 L145 760 Z" fill="#f2f2f2"/>
      <ellipse cx="190" cy="430" rx="75" ry="80" fill="#f2f2f2"/>
      <ellipse cx="190" cy="430" rx="42" ry="46" fill="#8e8e8e"/>
      <ellipse cx="190" cy="430" rx="18" ry="20" fill="#464646"/>
      <path d="M120 950 L260 950 L285 1075 L275 1130 L105 1130 L95 1075 Z" fill="#d4d4d4"/>
      <rect x="150" y="1010" width="80" height="52" rx="8" fill="#8e8e8e"/>
      <rect x="172" y="620" width="36" height="150" rx="10" fill="#d4d4d4"/>
    </g>
    <!-- right leg -->
    <g>
      <path d="M770 430 L850 430 L855 760 L835 990 L785 990 L765 760 Z" fill="#f2f2f2"/>
      <ellipse cx="810" cy="430" rx="75" ry="80" fill="#f2f2f2"/>
      <ellipse cx="810" cy="430" rx="42" ry="46" fill="#8e8e8e"/>
      <ellipse cx="810" cy="430" rx="18" ry="20" fill="#464646"/>
      <path d="M740 950 L880 950 L905 1075 L895 1130 L725 1130 L715 1075 Z" fill="#d4d4d4"/>
      <rect x="770" y="1010" width="80" height="52" rx="8" fill="#8e8e8e"/>
      <rect x="792" y="620" width="36" height="150" rx="10" fill="#d4d4d4"/>
    </g>

    <!-- ==== body ==== -->
    <path d="M280 360 L720 360 L720 1010 Q720 1090 640 1090 L360 1090 Q280 1090 280 1010 Z" fill="#f2f2f2"/>

    <!-- body panel seams -->
    <line x1="280" y1="560" x2="720" y2="560" stroke-width="6"/>
    <line x1="280" y1="820" x2="720" y2="820" stroke-width="6"/>

    <!-- upper body details -->
    <rect x="330" y="400" width="120" height="120" rx="12" fill="#d4d4d4"/>
    <rect x="352" y="422" width="76" height="30" rx="6" fill="#464646"/>
    <rect x="352" y="466" width="76" height="30" rx="6" fill="#8e8e8e"/>
    <rect x="550" y="400" width="120" height="120" rx="12" fill="#d4d4d4"/>
    <rect x="572" y="422" width="76" height="74" rx="6" fill="#464646"/>
    <circle cx="500" cy="460" r="34" fill="#8e8e8e"/>
    <circle cx="500" cy="460" r="14" fill="#464646"/>

    <!-- mid body: vents -->
    <rect x="340" y="610" width="140" height="160" rx="10" fill="#d4d4d4"/>
    <line x1="360" y1="642" x2="460" y2="642" stroke-width="10"/>
    <line x1="360" y1="676" x2="460" y2="676" stroke-width="10"/>
    <line x1="360" y1="710" x2="460" y2="710" stroke-width="10"/>
    <line x1="360" y1="744" x2="460" y2="744" stroke-width="10"/>
    <rect x="530" y="610" width="140" height="160" rx="10" fill="#d4d4d4"/>
    <line x1="550" y1="642" x2="650" y2="642" stroke-width="10"/>
    <line x1="550" y1="676" x2="650" y2="676" stroke-width="10"/>
    <line x1="550" y1="710" x2="650" y2="710" stroke-width="10"/>
    <line x1="550" y1="744" x2="650" y2="744" stroke-width="10"/>

    <!-- lower body details -->
    <rect x="380" y="860" width="90" height="70" rx="10" fill="#8e8e8e"/>
    <rect x="530" y="860" width="90" height="70" rx="10" fill="#d4d4d4"/>
    <circle cx="500" cy="990" r="30" fill="#d4d4d4"/>

    <!-- ==== dome ==== -->
    <path d="M270 360 Q270 130 500 130 Q730 130 730 360 Z" fill="#d4d4d4"/>
    <!-- dome bands -->
    <path d="M300 250 Q380 200 500 200 Q620 200 700 250" fill="none" stroke-width="6"/>
    <line x1="270" y1="330" x2="730" y2="330" stroke-width="6"/>
    <!-- main eye -->
    <circle cx="430" cy="270" r="52" fill="#464646"/>
    <circle cx="430" cy="270" r="30" fill="#1a1a1a"/>
    <circle cx="418" cy="256" r="10" fill="#f2f2f2" stroke="none"/>
    <!-- small lenses / projectors -->
    <rect x="540" y="240" width="70" height="52" rx="12" fill="#8e8e8e"/>
    <circle cx="575" cy="266" r="14" fill="#464646"/>
    <rect x="640" y="280" width="46" height="34" rx="10" fill="#8e8e8e"/>
    <!-- dome cap -->
    <rect x="470" y="140" width="60" height="26" rx="8" fill="#8e8e8e"/>
    <!-- antenna -->
    <line x1="620" y1="205" x2="640" y2="150" stroke-width="10"/>
    <circle cx="643" cy="142" r="12" fill="#464646"/>
  </g>
</svg>
